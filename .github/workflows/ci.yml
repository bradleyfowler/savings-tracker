name: CI

on:
  push: 
    branches: 
      - main

permissions:
  contents: read
  
concurrency:
  group: ci-${{ github.ref }}      

jobs: 
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint    

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
